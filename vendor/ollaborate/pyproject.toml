[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ollaborate"
version = "0.1.0"
description = "Multi-agent orchestration for Ollama, without the framework tax."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Patrik Hallsjö"}]
keywords = ["ollama", "agents", "multi-agent", "llm", "local-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["ollama>=0.4.7", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.14"]

[project.urls]
Homepage = "https://github.com/patrikhallsjo/ollaborate"
Repository = "https://github.com/patrikhallsjo/ollaborate"
Issues = "https://github.com/patrikhallsjo/ollaborate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ollaborate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["ollaborate"]

