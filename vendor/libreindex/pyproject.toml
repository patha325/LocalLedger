[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "libreindex"
version = "0.1.0"
description = "Local, offline retrieval-augmented generation over your files with Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrik Hallsjö" }]
keywords = ["ollama", "rag", "local-ai", "vector-search", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "lancedb>=0.20,<1",
  "pydantic>=2.7,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.9", "twine>=6"]

[project.urls]
Homepage = "https://github.com/patha325/libreindex"
Repository = "https://github.com/patha325/libreindex"
Issues = "https://github.com/patha325/libreindex/issues"

[project.scripts]
libreindex = "libreindex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/libreindex"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
